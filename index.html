<!-- ▼ OGP設定 -->

<meta property="og:description" content="G6（ジーシックス）は小岩を拠点に活動するGLAYのコピーバンド。ライブ動画をYouTubeで公開し、活動情報や最新ライブ告知を掲載しています。">

<style>
  body {
    background: url("images/top/background.jpeg") no-repeat center center fixed;
    background-size: cover;
    color: #fff;
    font-family: "Noto Sans JP", sans-serif;
    margin: 0;
    padding: 0;
  }

  .header {
    text-align: center;
    padding: 20px 0;
  }

  .header img {
    width: 100%;
    max-width: 1200px;
    height: auto;
  }

  .main-layout {
    position: relative;
    width: 90%;
    max-width: 1200px;
    margin: 0 auto;
  }

  .content-wrapper {
    width: 900px;
    margin: 0 auto;
  }

  .side-members {
    width: 260px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    position: absolute;
  }

  #leftMembers {
    left: calc(50% - 900px / 2 - 260px - 40px);
  }

  #rightMembers {
    right: calc(50% - 900px / 2 - 260px - 40px);
  }

  .side-members img {
    width: 100%;
    border-radius: 10px;
    box-shadow: 0 0 12px rgba(255,255,255,0.4);
  }

  .live-block {
    background: rgba(0,0,0,0.45);
    padding: 20px;
    border-radius: 10px;
    margin: 40px 0;
  }

  .summary-block {
    background: rgba(0,0,0,0.75);
  }

  .live-item {
    border-left: 5px solid #ff3b3b;
    padding-left: 10px;
    margin-bottom: 30px;
  }

  .year-title {
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 10px;
  }

  .live-img {
    width: 100%;
    margin-top: 10px;
    border-radius: 6px;
  }

  .link-mail,
  .link-youtube,
  .link-past {
    font-weight: 600;
    font-size: 20px;
    text-decoration: underline;
    text-shadow:
      1px 1px 0 #fff,
      -1px 1px 0 #fff,
      1px -1px 0 #fff,
      -1px -1px 0 #fff;
  }
  .link-mail { color: #4da3ff; }
  .link-youtube { color: #ff0000; }
  .link-past { color: #4caf50; }

  .mobile-members {
    display: none;
  }

  @media (max-width: 768px) {
    #leftMembers,
    #rightMembers {
      display: none;
    }

    .mobile-members {
      display: block;
      width: 90%;
      max-width: 900px;
      margin: 0 auto;
      padding: 10px 0;
    }

    .mobile-members .row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .mobile-members img {
      width: 32%;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(255,255,255,0.4);
    }

    .content-wrapper {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    .live-block {
      margin-top: 20px;
      padding: 16px;
    }
  }
</style>
</head>

<body>

<div class="header">
  <img src="images/top/title.png" alt="G6タイトルロゴ">
</div>

<div class="mobile-members">
  <div class="row">
    <img src="images/top/yamashita.jpg">
    <img src="images/top/sekiguchi.jpg">
    <img src="images/top/nishioka.jpg">
  </div>

  <div class="row">
    <img src="images/top/kazuya.jpg">
    <img src="images/top/akimoto.jpg">
    <img src="images/top/tsuji.jpg">
  </div>
</div>

<div class="main-layout">

  <div class="side-members" id="leftMembers">
    <img src="images/top/sekiguchi.jpg">
    <img src="images/top/yamashita.jpg">
    <img src="images/top/kazuya.jpg">
  </div>

  <div class="content-wrapper">
    <div class="live-block">
      <div class="live-item">
        <div class="year-title">2026年</div>
        <p>● 第4回 小岩ロックフェスティバル（2026.12.06）</p>
        <img src="images/2026/2026.12.06.jpg" class="live-img">
      </div>
    </div>

    <div class="live-block">
      <div class="live-item">
        <div class="year-title">2027年</div>
        <p>● 2027.3月　G6主催コピバンイベント開催予定<br>@小岩オルフェウス<br>----出演バンド募集中----</p>
      </div>
    </div>

    <div class="live-block summary-block">
      <div class="live-item">
        <p>お問い合わせ：
          <a href="mailto:g6.glaycopyband@gmail.com" class="link-mail">
            g6.glaycopyband@gmail.com
          </a>
        </p>
        <p>YouTube：
          <a href="https://www.youtube.com/@takuya4957" target="_blank" class="link-youtube">
            G6 Official Channel
          </a>
        </p>
        <p>
          <a href="live-history.html" class="link-past">
            ▶ 過去のライブはこちら
          </a>
        </p>
      </div>
    </div>
  </div>

  <div class="side-members" id="rightMembers">
    <img src="images/top/nishioka.jpg">
    <img src="images/top/tsuji.jpg">
    <img src="images/top/akimoto.jpg">
  </div>

</div>

<!-- ▼ カウンター削除済み（ここに新しいカウンターを入れる） -->

<script>
window.onload = function() {
  const firstBlock = document.querySelector(".live-block");
  const topPos = firstBlock.offsetTop;
  document.getElementById("leftMembers").style.top = topPos + "px";
  document.getElementById("rightMembers").style.top = topPos + "px";
};
</script>

</html>
